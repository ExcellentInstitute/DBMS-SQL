<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Excellent Institute - DBMS & SQL Masterclass</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Fira+Code:wght@400;500;600&display=swap" rel="stylesheet">
    
    <style>
        :root {
            /* Premium DATA STUDIO INDIGO Palette */
            --primary: #3730a3; 
            --primary-dark: #1e1b4b;
            --primary-light: #e0e7ff;
            --accent: #4f46e5;
            --accent-soft: #eef2ff;
            --surface: #ffffff;
            --background: #f8fafc; 
            --text-main: #0f172a;
            --text-muted: #64748b;
            --border: #e2e8f0;
            --shadow-sm: 0 1px 3px rgba(0,0,0,0.05);
            --shadow-md: 0 4px 6px -1px rgba(0,0,0,0.1);
            --shadow-lg: 0 10px 15px -3px rgba(79, 70, 229, 0.12);
            --radius: 12px;
        }
        
        * { box-sizing: border-box; }

        body {
            font-family: 'Inter', sans-serif;
            margin: 0;
            display: flex;
            flex-direction: column;
            background-color: var(--background);
            color: var(--text-main);
            height: 100vh;
            overflow: hidden;
            letter-spacing: -0.01em;
        }

        ::-webkit-scrollbar { width: 8px; height: 8px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #a5b4fc; border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: #818cf8; }

        /* Top Reading Progress Bar */
        .progress-container {
            width: 100%;
            height: 4px;
            background: var(--border);
            position: relative;
            z-index: 20;
        }
        .progress-bar {
            height: 100%;
            background: linear-gradient(90deg, var(--primary), var(--accent), #06b6d4);
            width: 0%;
            transition: width 0.15s ease-out;
        }

        .header {
            display: flex; justify-content: space-between; align-items: center;
            padding: 12px 24px; background-color: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(10px); border-bottom: 1px solid var(--border);
            z-index: 10; box-shadow: var(--shadow-sm);
        }

        .brand { display: flex; align-items: center; gap: 15px; }

        .toggle-btn {
            background: none; border: none; color: var(--primary); cursor: pointer;
            padding: 6px; display: flex; align-items: center; justify-content: center;
            border-radius: 6px; transition: background 0.2s ease;
        }
        .toggle-btn:hover { background-color: var(--primary-light); }

        .brand img.logo {
            width: 35px; height: 35px; border-radius: 50%; object-fit: cover;
            border: 2px solid var(--accent); box-shadow: var(--shadow-sm); cursor: pointer;
        }

        .brand h2 { margin: 0; color: var(--primary); font-size: 1.3rem; font-weight: 700; cursor: pointer; }

        .action-btns { display: flex; align-items: center; gap: 10px; }

        .action-btns button {
            background-color: var(--surface); color: var(--text-main);
            border: 1px solid var(--border); padding: 10px 20px; border-radius: 8px;
            cursor: pointer; font-weight: 600; font-family: inherit; transition: all 0.2s ease;
            box-shadow: var(--shadow-sm); display: flex; align-items: center; gap: 8px;
        }
        .action-btns button:hover { background-color: var(--primary-light); border-color: var(--accent); color: var(--primary); transform: translateY(-1px); }

        .main-container { display: flex; flex: 1; overflow: hidden; }

        .sidebar {
            width: 310px; background-color: var(--surface); border-right: 1px solid var(--border);
            padding: 24px 16px; overflow-y: auto; overflow-x: hidden; flex-shrink: 0;
            display: flex; flex-direction: column; gap: 6px;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1); opacity: 1;
        }
        
        .sidebar.collapsed { width: 0; padding: 24px 0; border-right: none; opacity: 0; }
        
        .nav-label {
            font-size: 0.75rem; text-transform: uppercase; font-weight: 700;
            color: var(--text-muted); margin-bottom: 10px; padding-left: 12px; white-space: nowrap;
            letter-spacing: 0.05em;
        }

        .nav-btn {
            display: flex; align-items: center; width: 100%; padding: 12px 16px;
            border: none; background: none; text-align: left; font-size: 0.95rem;
            font-weight: 600; color: var(--text-muted); cursor: pointer;
            border-radius: var(--radius); transition: all 0.2s ease; white-space: nowrap;
            overflow: hidden; text-overflow: ellipsis;
        }
        .nav-btn:hover { background-color: var(--background); color: var(--text-main); }
        .nav-btn.active { background-color: var(--primary-light); color: var(--primary); font-weight: 700; }

        .content-area {
            flex: 1; padding: 40px 60px; overflow-y: auto; background-color: transparent; 
            cursor: grab; scroll-behavior: smooth;
        }
        .content-area:active { cursor: grabbing; } 

        .content-wrapper {
            max-width: 1200px; margin: 0 auto; background: var(--surface);
            padding: 40px 50px; border-radius: var(--radius); box-shadow: var(--shadow-md); 
            animation: fadeIn 0.4s ease forwards; position: relative; z-index: 2; transition: max-width 0.3s ease;
            border: 1px solid var(--border);
        }

        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        .note-section { pointer-events: none; }
        .note-section.allow-select { pointer-events: auto; }

        .chapter-badge {
            display: inline-block;
            background: var(--primary-light);
            color: var(--primary);
            font-size: 0.85rem;
            font-weight: 700;
            padding: 6px 14px;
            border-radius: 20px;
            margin-bottom: 12px;
            text-transform: uppercase;
            letter-spacing: 0.04em;
        }

        .note-section h1 {
            color: var(--text-main); font-size: 2.2rem; font-weight: 800;
            margin: 0 0 30px 0; border-bottom: 2px solid var(--border); padding-bottom: 15px;
        }

        .topic-card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 24px 28px;
            margin-bottom: 28px;
            box-shadow: var(--shadow-sm);
            transition: border-color 0.2s ease;
        }
        .topic-card:hover {
            border-color: #c7d2fe;
        }

        .note-section h3 {
            color: var(--primary); font-size: 1.4rem; margin-top: 0;
            border-bottom: 1px solid var(--border); padding-bottom: 12px;
            display: flex; align-items: center; gap: 10px;
        }

        .note-section p, .note-section li {
            line-height: 1.8; font-size: 1.08rem; color: #334155;
        }

        .note-section ul {
            padding-left: 22px;
            margin: 12px 0;
        }

        .note-section li {
            margin-bottom: 8px;
        }

        /* Bridge Connection Callout inside text */
        .bridge-callout {
            background: linear-gradient(90deg, #eff6ff, #f5f3ff);
            border-left: 4px solid #6366f1;
            padding: 14px 18px;
            border-radius: 0 8px 8px 0;
            margin: 16px 0;
            font-size: 1rem;
            color: #1e1b4b;
        }

        /* Real-World Analogy Box */
        .analogy-box {
            background-color: #fefce8;
            border-left: 4px solid #eab308;
            padding: 14px 18px;
            border-radius: 0 8px 8px 0;
            margin: 16px 0;
            font-size: 1rem;
            color: #713f12;
        }

        /* Upgraded SQL Query & Syntax Box */
        .shortcut-box {
            background-color: var(--accent-soft);
            border-left: 4px solid var(--accent);
            padding: 16px 20px;
            margin: 20px 0;
            border-radius: 0 10px 10px 0;
            font-size: 1.02rem;
            color: var(--primary-dark);
        }

        .shortcut-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
        }

        .copy-code-btn {
            background: var(--surface);
            color: var(--primary);
            border: 1px solid #c7d2fe;
            padding: 4px 12px;
            border-radius: 6px;
            font-size: 0.8rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
            pointer-events: auto;
        }
        .copy-code-btn:hover {
            background: var(--primary);
            color: white;
        }
        
        .shortcut-box code {
            font-family: 'Fira Code', monospace;
            background: #0f172a;
            color: #38bdf8;
            padding: 14px 16px;
            border-radius: 8px;
            display: block;
            margin-top: 8px;
            font-size: 0.95rem;
            line-height: 1.6;
            white-space: pre-wrap;
            word-break: break-word;
            overflow-x: auto;
            box-shadow: inset 0 2px 4px rgba(0,0,0,0.3);
            border: 1px solid #1e293b;
        }

        .note-section img {
            max-width: 600px;
            width: 30%;
            height: auto; 
            display: block; 
            margin: 25px auto 12px auto;
            border: 1px solid var(--border);
            border-radius: 8px; 
            box-shadow: var(--shadow-sm);
            cursor: zoom-in; 
            pointer-events: auto; 
            transition: transform 0.2s;
        }
        .note-section img:hover { transform: scale(1.01); box-shadow: var(--shadow-md); }
        .img-caption { font-size: 0.9rem; color: var(--text-muted); text-align: center; margin-bottom: 20px; }

        /* Chapter Bottom Navigation */
        .chapter-footer-nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 15px;
            margin-top: 40px;
            padding-top: 25px;
            border-top: 2px solid var(--border);
            pointer-events: auto;
            flex-wrap: wrap;
        }

        .chapter-nav-btn {
            background: var(--surface);
            color: var(--primary);
            border: 1px solid var(--border);
            padding: 12px 22px;
            border-radius: 10px;
            font-weight: 700;
            font-size: 0.95rem;
            cursor: pointer;
            transition: all 0.2s ease;
            box-shadow: var(--shadow-sm);
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .chapter-nav-btn:hover {
            background: var(--primary);
            color: white;
            border-color: var(--primary);
            transform: translateY(-2px);
        }

        .hero { text-align: center; margin-bottom: 40px; }
        .hero h1 { font-size: 2.5rem; color: var(--text-main); margin-bottom: 10px; }
        .hero p { color: var(--text-muted); font-size: 1.1rem; max-width: 700px; margin: 0 auto; line-height: 1.6; }
        
        .dashboard-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 24px; pointer-events: auto; }
        .module-card {
            background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius);
            padding: 24px; cursor: pointer; transition: all 0.3s ease; box-shadow: var(--shadow-sm);
            display: flex; flex-direction: column; align-items: flex-start; position: relative; overflow: hidden;
        }
        .module-card::before {
            content: ''; position: absolute; top: 0; left: 0; width: 100%; height: 4px;
            background: linear-gradient(90deg, var(--primary), var(--accent));
        }
        .module-card:hover { transform: translateY(-5px); box-shadow: var(--shadow-lg); border-color: var(--accent); }
        .card-icon {
            font-size: 2rem; margin-bottom: 15px; background: var(--primary-light);
            width: 52px; height: 52px; display: flex; align-items: center; justify-content: center; border-radius: 12px;
        }
        .module-card h3 { margin: 0 0 10px 0; color: var(--text-main); font-size: 1.2rem; line-height: 1.35; }
        .module-card span { font-size: 0.85rem; color: var(--primary); font-weight: 700; background: var(--accent-soft); padding: 4px 10px; border-radius: 20px; margin-top: auto; }

        #lightbox {
            display: none; position: fixed; z-index: 10000; left: 0; top: 0; width: 100%; height: 100%;
            background-color: rgba(15, 23, 42, 0.9); backdrop-filter: blur(5px);
            overflow: auto; text-align: center; padding: 50px 20px;
        }
        #lightbox img { 
            display: inline-block; vertical-align: middle;
            max-width: 90%; max-height: 85vh; border-radius: 8px; 
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5); 
            cursor: zoom-in; transition: all 0.3s ease; transform-origin: top center;
        }
        #lightbox img.zoomed { max-width: none; max-height: none; width: 140%; cursor: zoom-out; margin-bottom: 50px; }

        .watermark-bg {
            position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%);
            width: 45vw; max-width: 400px; opacity: 0.04; pointer-events: none; 
            z-index: 9999; border-radius: 50%; object-fit: cover;
        }

        @media (max-width: 768px) {
            .main-container { flex-direction: column; }
            .sidebar { width: 100%; height: auto; border-right: none; border-bottom: 1px solid var(--border); flex-direction: row; overflow-x: auto; padding: 12px; gap: 10px;}
            .sidebar.collapsed { height: 0; padding: 0; border: none; opacity: 0; }
            .nav-label { display: none; }
            .nav-btn { white-space: nowrap; padding: 8px 16px; border-radius: 20px; border: 1px solid var(--border); width: auto; }
            .content-area { padding: 20px 15px; }
            .content-wrapper { padding: 25px 20px; }
            .topic-card { padding: 18px 16px; }
            .note-section img { width: 80%; }
            .watermark-bg { width: 70vw; }
        }

        @media print {
            html, body, .main-container, .content-area, .content-wrapper { height: auto !important; overflow: visible !important; position: static !important; display: block !important; background-color: transparent !important; }
            .sidebar, .header, .action-btns, .dashboard-grid, .hero, .toggle-btn, .progress-container, .chapter-footer-nav, .copy-code-btn { display: none !important; }
            .content-area { padding: 0 !important; margin: 0 !important; border: none !important; }
            .content-wrapper { margin: 0 !important; padding: 0 !important; box-shadow: none !important; border: none !important; max-width: 100% !important; }
            .note-section { pointer-events: auto !important; }
            .topic-card { border: none !important; padding: 10px 0 !important; box-shadow: none !important; }
            .watermark-bg { display: block !important; position: fixed !important; top: 50% !important; left: 50% !important; transform: translate(-50%, -50%) !important; opacity: 0.08 !important; width: 60vw !important; max-width: 600px !important; z-index: -1 !important; }
            h1 { page-break-before: always; color: #000; padding-top: 20px; }
            h1:first-of-type { page-break-before: avoid; padding-top: 0; } 
            h3 { color: #000; border-bottom: 1px solid #ccc; page-break-after: avoid; }
            img { page-break-inside: avoid; border: none; max-width: 100% !important; margin: 15px 0 !important; }
            p, ul, li, .shortcut-box { page-break-inside: avoid; }
        }
    </style>
</head>
<body>

    <div class="progress-container">
        <div class="progress-bar" id="reading-progress"></div>
    </div>

    <div class="header">
        <div class="brand">
            <button id="sidebar-toggle" class="toggle-btn" onclick="toggleSidebar()" title="Hide/Show Menu">
                <svg width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M4 6h16M4 12h16M4 18h16"></path>
                </svg>
            </button>
            <img src="images/logo.png" alt="Excellent Institute Logo" class="logo" id="mainLogo" onclick="loadDashboard()" onerror="this.style.display='none'">
            <h2 onclick="loadDashboard()">Excellent Institute</h2>
        </div>
        <div class="action-btns">
            <button onclick="window.print()">🖨️ Print / PDF</button>
        </div>
    </div>

    <img src="images/logo.png" alt="Watermark" class="watermark-bg" id="watermarkLogo" onerror="this.style.display='none'">

    <div class="main-container">
        <div class="sidebar" id="main-sidebar">
            <div class="nav-label">DBMS & SQL Syllabus</div>
            <button class="nav-btn active" onclick="loadDashboard()" id="home-btn">🏠 Dashboard</button>
            <div id="nav-container" style="display: flex; flex-direction: column; gap: 6px;"></div>
        </div>

        <div class="content-area" id="content-display"></div>
    </div>

    <div id="lightbox" onclick="closeLightbox(event)">
        <img id="lightbox-img" src="" alt="Enlarged view" onclick="toggleZoom(event)">
    </div>

    <!-- Links to your DBMS Data File -->
    <script src="dbms-data.js"></script>
    
    <script>
        const navContainer = document.getElementById('nav-container');
        const contentDisplay = document.getElementById('content-display');
        const sidebar = document.getElementById('main-sidebar');
        const progressBar = document.getElementById('reading-progress');

        // Universal Data Hook for Flutter Offline PDF Builder
        function getCourseData() {
            const activeData = typeof dbmsBookData !== 'undefined' ? dbmsBookData : (typeof cBookData !== 'undefined' ? cBookData : null);
            if (!activeData) return null;
            return activeData.map(ch => ({
                ...ch,
                topics: (ch.topics || []).map(t => ({
                    ...t,
                    shortcut: t.shortcut || t.codeSnippet || ''
                }))
            }));
        }

        function initApp() {
            if (typeof dbmsBookData === 'undefined') {
                contentDisplay.innerHTML = `<h2 style="color:red; text-align:center; padding:50px;">Awaiting Data File (dbms-data.js)...</h2>`;
                return;
            }
            dbmsBookData.forEach((chapter, index) => {
                const btn = document.createElement('button');
                btn.className = 'nav-btn note-nav-btn';
                btn.innerHTML = `🗄️ ${chapter.title.split(':')[0]}`; 
                btn.title = chapter.title;
                btn.onclick = () => loadContent(index, btn);
                navContainer.appendChild(btn);
            });
            loadEntryScreen(); 
        }

        function toggleSidebar() {
            sidebar.classList.toggle('collapsed');
        }

        function loadEntryScreen() {
            document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
            progressBar.style.width = '0%';

            let html = `
            <div class="content-wrapper allow-select" style="text-align: center; margin-top: 3vh;">
                <span class="chapter-badge">Complete Student Guidebook</span>
                <h1 style="font-size: 2.8rem; color: var(--primary); margin-bottom: 10px; border: none;">Database Management System (DBMS) & SQL</h1>
                <p style="font-size: 1.2rem; color: var(--text-muted); margin-bottom: 30px; max-width: 720px; margin-left: auto; margin-right: auto;">
                    Discover how apps like YouTube, SBI Bank, and school portals store millions of records safely—and learn to talk to databases using SQL!
                </p>
                
                <img src="images/dbms-preview.png" alt="DBMS Course Preview" 
                     style="width: 100%; max-width: 500px; border-radius: 12px; box-shadow: 0 10px 25px rgba(0,0,0,0.15); border: 2px solid var(--border); margin-bottom: 40px; cursor: zoom-in;" 
                     onclick="openLightbox(this.src)"
                     onerror="this.style.display='none'">
                <br>
                
                <button onclick="loadDashboard()" style="background: linear-gradient(135deg, var(--primary), var(--accent)); color: white; border: none; padding: 16px 42px; font-size: 1.2rem; border-radius: 10px; cursor: pointer; font-weight: 700; box-shadow: var(--shadow-lg);">
                    Enter Database Studio 🚀
                </button>
            </div>`;
            
            contentDisplay.innerHTML = html;
            contentDisplay.scrollTop = 0;
        }

        function loadDashboard() {
            document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
            document.getElementById('home-btn').classList.add('active');
            progressBar.style.width = '0%';

            let html = `
            <div class="content-wrapper allow-select">
                <div class="hero">
                    <span class="chapter-badge">Interactive Course Syllabus</span>
                    <h1>DBMS & SQL Masterclass</h1>
                    <p>Step-by-step connected lessons from basic data concepts and ER diagrams to Normalization and real-world SQL Queries.</p>
                </div>
                <div class="dashboard-grid">`;
            
            const icons = ['🗄️', '⚖️', '🏗️', '🗺️', '🧹', '💬', '🛠️', '⚡'];
            if (typeof dbmsBookData !== 'undefined') {
                dbmsBookData.forEach((chapter, index) => {
                    let icon = icons[index % icons.length];
                    html += `
                        <div class="module-card" onclick="document.querySelectorAll('.note-nav-btn')[${index}].click()">
                            <div class="card-icon">${icon}</div>
                            <h3>${chapter.title}</h3>
                            <span>📚 ${chapter.topics.length} Detailed Lessons</span>
                        </div>`;
                });
            }

            html += `</div></div>`;
            contentDisplay.innerHTML = html;
            contentDisplay.scrollTop = 0;
        }

        function copySnippet(btnElement, encodedCode) {
            const decoded = decodeURIComponent(encodedCode);
            navigator.clipboard.writeText(decoded).then(() => {
                const originalText = btnElement.innerText;
                btnElement.innerText = '✅ Copied!';
                setTimeout(() => { btnElement.innerText = originalText; }, 1500);
            });
        }

        function loadContent(index, clickedBtn) {
            document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
            if(clickedBtn) clickedBtn.classList.add('active');

            const chapter = dbmsBookData[index];

            let htmlContent = `
            <div class="content-wrapper">
                <div class="note-section allow-select">
                    <span class="chapter-badge">Module ${index + 1} of ${dbmsBookData.length}</span>
                    <h1>${chapter.title}</h1>`;
            
            chapter.topics.forEach((topic, tIdx) => {
                htmlContent += `<div class="topic-card">`;
                htmlContent += `<h3><span>${index + 1}.${tIdx + 1}</span> ${topic.heading}</h3>`;
                htmlContent += `<p>${topic.text}</p>`;
                
                // Display SQL Examples, Diagrams, or Key Rules
                if(topic.codeSnippet) {
                    const encoded = encodeURIComponent(topic.codeSnippet);
                    htmlContent += `
                    <div class="shortcut-box">
                        <div class="shortcut-header">
                            <strong>💻 SQL / Database Example:</strong>
                            <button class="copy-code-btn" onclick="copySnippet(this, '${encoded}')">📋 Copy</button>
                        </div>
                        <code>${topic.codeSnippet}</code>
                    </div>`;
                }

                if(topic.imgSrc) {
                    htmlContent += `<img src="${topic.imgSrc}" alt="${topic.heading}" onclick="openLightbox(this.src)" onerror="this.style.display='none'; this.nextElementSibling.style.display='none';">`;
                    htmlContent += `<div class="img-caption">Figure: ${topic.heading}</div>`;
                }
                htmlContent += `</div>`;
            });

            // Footer Navigation Buttons (Previous / Dashboard / Next)
            htmlContent += `<div class="chapter-footer-nav">`;
            if (index > 0) {
                htmlContent += `<button class="chapter-nav-btn" onclick="document.querySelectorAll('.note-nav-btn')[${index - 1}].click()">⬅️ Previous Chapter</button>`;
            } else {
                htmlContent += `<button class="chapter-nav-btn" onclick="loadDashboard()">🏠 Back to Dashboard</button>`;
            }

            if (index < dbmsBookData.length - 1) {
                htmlContent += `<button class="chapter-nav-btn" onclick="document.querySelectorAll('.note-nav-btn')[${index + 1}].click()">Next Chapter ➡️</button>`;
            } else {
                htmlContent += `<button class="chapter-nav-btn" onclick="loadDashboard()">🎉 Finish & Return to Dashboard</button>`;
            }
            htmlContent += `</div>`;

            htmlContent += `</div></div>`;
            
            contentDisplay.innerHTML = htmlContent;
            contentDisplay.scrollTop = 0;
            progressBar.style.width = '0%';
            
            if(window.innerWidth <= 768) {
                sidebar.classList.add('collapsed');
            }
        }

        // Update Top Progress Bar on Scroll
        contentDisplay.addEventListener('scroll', () => {
            const scrollTop = contentDisplay.scrollTop;
            const scrollHeight = contentDisplay.scrollHeight - contentDisplay.clientHeight;
            if (scrollHeight > 0) {
                const progress = (scrollTop / scrollHeight) * 100;
                progressBar.style.width = progress + '%';
            } else {
                progressBar.style.width = '0%';
            }
        });

        function openLightbox(src) {
            const img = document.getElementById('lightbox-img');
            img.src = src;
            img.classList.remove('zoomed');
            document.getElementById('lightbox').style.display = 'block'; 
        }

        function closeLightbox(e) {
            if (e.target.id === 'lightbox') {
                document.getElementById('lightbox').style.display = 'none';
            }
        }

        function toggleZoom(e) {
            e.stopPropagation(); 
            const img = e.target;
            img.classList.toggle('zoomed');
        }

        let isDown = false, startY, scrollTop;

        contentDisplay.addEventListener('mousedown', (e) => {
            if(e.target.closest('.module-card') || e.target.closest('.chapter-nav-btn') || e.target.closest('.copy-code-btn') || e.target.tagName === 'IMG') return;
            isDown = true;
            startY = e.pageY - contentDisplay.offsetTop;
            scrollTop = contentDisplay.scrollTop;
            let noteSec = contentDisplay.querySelector('.note-section');
            if(noteSec) noteSec.classList.remove('allow-select');
        });

        contentDisplay.addEventListener('mouseleave', () => {
            isDown = false;
            let noteSec = contentDisplay.querySelector('.note-section');
            if(noteSec) noteSec.classList.add('allow-select');
        });

        contentDisplay.addEventListener('mouseup', () => {
            isDown = false;
            let noteSec = contentDisplay.querySelector('.note-section');
            if(noteSec) noteSec.classList.add('allow-select');
        });

        contentDisplay.addEventListener('mousemove', (e) => {
            if (!isDown) return;
            e.preventDefault();
            const y = e.pageY - contentDisplay.offsetTop;
            const walk = (y - startY) * 2; 
            contentDisplay.scrollTop = scrollTop - walk;
        });

        window.onload = initApp;
    </script>
</body>
</html>
